<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0F1E">
<meta name="description" content="A gamified chemistry sketchbook — kitchen experiments, an ocean liner's engine room, and retro platformer physics, all exploring physical vs chemical change.">
<meta property="og:title" content="Chem Lab Logbook">
<meta property="og:description" content="15 hands-on chemistry missions across 3 worlds, with sketching and Anki flashcard export.">
<meta property="og:type" content="website">
<title>Chem Lab Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ship chrome (dark navy + gold), matching J.J.'s Sketchbooks collection */
    --navy:#0A0F1E;
    --navy-card:#141B2E;
    --navy-card-alt:#1B2438;
    --navy-border:#2A3550;
    --gold:#E3B341;
    --gold-dark:#C1902E;
    --text-light:#F3EFE3;
    --text-muted:#93A0B8;
    --sage:#6FA284;
    --sage-dark:#4C7A62;
    --tomato:#D9724B;
    --steel:#5B93B0;
    --kitchen-accent:#E0954A;
    --titanic-accent:#5B93B0;
    --pixel-accent:#D64550;

    /* paper pages (diagrams / sketch canvases / interactive step cards) */
    --paper:#FAF3E3;
    --paper-card:#FFFDF8;
    --ink:#2E2A24;
    --ink-soft:#6B6459;
    --line:#E6DCC6;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--text-light);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;font-weight:700;}
  button{font-family:inherit;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;padding:20px 18px 60px;}

  /* ---------- HERO ---------- */
  .hero{display:flex;justify-content:center;margin:6px 0 18px;}
  .hero svg{width:150px;height:150px;}
  .kicker{display:flex;justify-content:center;margin-bottom:14px;}
  .kicker-pill{border:1.5px solid var(--gold-dark);color:var(--gold);background:rgba(227,179,65,0.08);
    font-size:12px;font-weight:700;letter-spacing:1.5px;padding:8px 16px;border-radius:99px;}

  /* ---------- HEADER ---------- */
  .top{text-align:center;margin-bottom:6px;}
  .top h1{font-size:28px;margin:0;line-height:1.15;color:var(--text-light);}
  .top .sub{color:var(--gold);font-weight:700;font-size:15px;margin-top:8px;}
  .top .sub2{color:var(--text-muted);font-size:14px;margin-top:8px;line-height:1.5;max-width:420px;margin-left:auto;margin-right:auto;}

  .progress-wrap{margin:20px 0 16px;}
  .progress-track{background:var(--navy-card-alt);border-radius:99px;height:14px;overflow:hidden;border:1px solid var(--navy-border);}
  .progress-fill{background:linear-gradient(90deg,var(--gold-dark),var(--gold));height:100%;border-radius:99px;transition:width .4s ease;}
  .progress-label{font-size:13px;color:var(--text-muted);margin-top:6px;font-weight:600;}
  .progress-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .progress-top-row .progress-label{margin-top:0;}
  .xp-pill{background:rgba(227,179,65,0.12);border:1px solid var(--gold-dark);color:var(--gold);font-weight:700;font-size:13px;
    padding:5px 12px;border-radius:99px;white-space:nowrap;}

  .badgerow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 18px;margin-bottom:2px;}
  .badgechip{flex-shrink:0;width:78px;text-align:center;padding:10px 6px;border-radius:14px;
    border:1.5px solid var(--navy-border);background:var(--navy-card);}
  .badgechip.earned{border-color:var(--gold);background:rgba(227,179,65,0.1);}
  .badgechip .bemoji{font-size:24px;display:block;margin-bottom:4px;filter:grayscale(1);opacity:0.35;}
  .badgechip.earned .bemoji{filter:none;opacity:1;}
  .badgechip .blabel{font-size:10px;font-weight:700;color:var(--text-muted);line-height:1.2;}
  .badgechip.earned .blabel{color:var(--gold);}

  /* ---------- ZONE CARDS (logbook-style outer cards) ---------- */
  .zonesection{position:relative;margin-bottom:20px;background:var(--navy-card);
    border:1px solid var(--navy-border);border-radius:22px;padding:20px 18px 18px 26px;overflow:hidden;}
  .zonesection::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;
    background-image:repeating-linear-gradient(to bottom, var(--zone-accent,var(--gold)) 0 10px, transparent 10px 20px);}
  .zonesection::after{content:'';position:absolute;top:16px;right:16px;width:9px;height:9px;
    border-radius:50%;background:var(--gold);}
  .zonesection.zone-kitchen{--zone-accent:var(--kitchen-accent);}
  .zonesection.zone-titanic{--zone-accent:var(--titanic-accent);}
  .zonesection.zone-pixel{--zone-accent:var(--pixel-accent);}
  .zoneheader{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .zoneheader h2{font-size:18px;margin:0;color:var(--text-light);}
  .zoneheader .zprog{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;}
  .zonesub{font-size:13px;color:var(--text-muted);margin:0 0 14px;line-height:1.4;}

  /* ---------- HOME GRID (mission tiles inside a zone card) ---------- */
  .grid{display:flex;flex-direction:column;gap:10px;}
  .rcard{background:var(--navy-card-alt);border:1px solid var(--navy-border);border-radius:14px;
    padding:14px 14px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .12s ease;}
  .rcard:active{transform:scale(0.98);}
  .rcard .emoji{font-size:30px;flex-shrink:0;width:42px;text-align:center;}
  .rcard .info{flex:1;min-width:0;}
  .rcard .info h3{margin:0 0 3px;font-size:15px;color:var(--text-light);font-family:'Baloo 2',sans-serif;font-weight:600;}
  .rcard .info p{margin:0;font-size:12px;color:var(--text-muted);}
  .badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
  .badge.notstarted{background:rgba(255,255,255,0.06);color:var(--text-muted);}
  .badge.inprogress{background:rgba(227,179,65,0.14);color:var(--gold);}
  .badge.done{background:rgba(111,162,132,0.18);color:var(--sage);}
  .rcard .statuswrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .trafficdot{width:11px;height:11px;border-radius:50%;}
  .trafficdot.green{background:var(--sage);}
  .trafficdot.yellow{background:var(--gold);}

  .cookbookbtn{width:100%;background:var(--navy-card);border:1.5px solid var(--gold-dark);color:var(--gold);
    border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:18px;}
  .cookbookentry{margin-bottom:22px;padding-bottom:22px;border-bottom:1.5px dashed var(--navy-border);}
  .cookbookentry:last-child{border-bottom:none;}
  .zoneflag{font-size:11px;font-weight:700;color:var(--gold);text-transform:none;margin-bottom:2px;}

  /* ---------- MISSION VIEW ---------- */
  .missionview{display:none;}
  .missionview.active{display:block;}
  .backbtn{background:none;border:none;color:var(--text-muted);font-size:15px;font-weight:600;
    padding:8px 0;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .mtitle{font-size:22px;margin:2px 0 4px;color:var(--text-light);}
  .mstory{font-size:14px;color:var(--text-muted);margin:0 0 16px;line-height:1.4;}

  /* diagrams stay on cream "paper" pages, like a real sketchbook pasted into the dark UI */
  .diagram-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;box-shadow:0 6px 16px rgba(0,0,0,0.35);}
  .diagram-box svg{width:100%;height:auto;display:block;}

  .dots{display:flex;gap:7px;justify-content:center;margin-bottom:16px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--navy-border);}
  .dot.on{background:var(--gold);}
  .dot.pastdone{background:var(--sage);}

  .stepcard{background:var(--navy-card);border:1px solid var(--navy-border);border-radius:var(--radius);
    padding:20px 18px;}
  .stepkicker{font-size:12px;font-weight:700;letter-spacing:0.5px;color:var(--gold);margin:0 0 6px;}
  .stepq{font-size:18px;margin:0 0 16px;line-height:1.3;color:var(--text-light);}

  .chipgrid{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;}
  .chip{border:1.5px solid var(--navy-border);background:var(--navy-card-alt);border-radius:99px;padding:10px 16px;
    font-size:14px;font-weight:600;cursor:pointer;color:var(--text-light);}
  .chip.sel{border-color:var(--gold);background:rgba(227,179,65,0.14);color:var(--gold);}

  .presetgrid{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .preset{text-align:left;border:1.5px solid var(--navy-border);background:var(--navy-card-alt);border-radius:14px;
    padding:13px 15px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text-light);}
  .preset.sel{border-color:var(--gold);background:rgba(227,179,65,0.14);}
  .ownwrap{margin-top:4px;}
  .ownwrap label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .ownwrap textarea{width:100%;margin-top:6px;border:1.5px solid var(--navy-border);border-radius:12px;
    padding:10px 12px;font-size:15px;font-family:inherit;resize:none;background:var(--navy-card-alt);color:var(--text-light);}

  .sentence{font-size:17px;line-height:1.7;margin-bottom:16px;padding:14px;background:var(--paper);color:var(--ink);
    border:1.5px dashed var(--gold-dark);border-radius:12px;}
  .blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--gold-dark);
    padding:0 4px;font-weight:700;color:var(--gold-dark);}
  .wordbank{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px;}
  .word{border:1.5px solid var(--navy-border);background:var(--navy-card-alt);border-radius:10px;padding:9px 14px;
    font-size:14px;font-weight:600;cursor:pointer;color:var(--text-light);}
  .word.sel{border-color:var(--gold);background:rgba(227,179,65,0.14);color:var(--gold);}

  .labelgrid{display:flex;flex-direction:column;gap:12px;margin-bottom:6px;}
  .labelbtn{border:1.5px solid var(--navy-border);background:var(--navy-card-alt);border-radius:14px;
    padding:16px;font-size:16px;font-weight:700;cursor:pointer;color:var(--text-light);text-align:center;}
  .labelbtn.pick-a{border-color:var(--steel);}
  .labelbtn.pick-b{border-color:var(--tomato);}
  .labelbtn.chosen-right{background:rgba(111,162,132,0.18);border-color:var(--sage);color:#B9D9C4;}

  .feedback{margin-top:14px;padding:14px;background:rgba(227,179,65,0.08);border-left:4px solid var(--gold);
    border-radius:10px;font-size:14px;line-height:1.5;color:var(--text-light);}
  .feedback b{color:var(--gold);}

  .navrow{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .nextbtn{flex:1;background:linear-gradient(180deg,var(--gold),var(--gold-dark));color:#241A05;border:none;border-radius:14px;
    padding:14px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #8C6A20;}
  .nextbtn:disabled{background:var(--navy-card-alt);color:var(--text-muted);box-shadow:none;cursor:not-allowed;}
  .backstep{background:none;border:1.5px solid var(--navy-border);border-radius:14px;padding:14px 18px;
    font-size:15px;font-weight:700;color:var(--text-muted);cursor:pointer;}

  /* ---------- SUMMARY ---------- */
  .summary h2{font-size:20px;margin-bottom:4px;color:var(--text-light);}
  .summary .sub{color:var(--text-muted);font-size:14px;margin-bottom:16px;}
  .sumcard{background:var(--navy-card);border:1px solid var(--navy-border);border-radius:var(--radius);
    padding:18px;}
  .sumrow{margin-bottom:14px;}
  .sumrow:last-child{margin-bottom:0;}
  .sumrow .k{font-size:12px;font-weight:700;color:var(--gold);text-transform:none;margin-bottom:3px;}
  .sumrow .v{font-size:15px;line-height:1.4;color:var(--text-light);}
  .donebadge{display:inline-block;background:rgba(111,162,132,0.18);color:var(--sage);font-weight:700;font-size:13px;
    padding:6px 12px;border-radius:99px;margin-bottom:14px;}

  /* ---------- SKETCH (stays on paper, like a real sketchbook page) ---------- */
  .sketchrow{display:flex;flex-direction:column;gap:20px;margin-bottom:6px;}
  .sketchlabel{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:6px;}
  .canvaswrap{background:var(--paper-card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 6px 16px rgba(0,0,0,0.3);}
  .sketchcanvas{width:100%;height:170px;display:block;touch-action:none;}
  .sketchtools{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
  .swatch.on{border-color:var(--gold);}
  .toolbtn{border:1.5px solid var(--navy-border);background:var(--navy-card-alt);border-radius:10px;padding:7px 12px;
    font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;margin-left:auto;}
  .toolbtn:active{transform:scale(0.96);}
  .sketchsumrow{display:flex;gap:10px;flex-wrap:wrap;}
  .sketchthumb{width:130px;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;}
  .homebtn{width:100%;margin-top:18px;background:linear-gradient(180deg,var(--gold),var(--gold-dark));color:#241A05;border:none;border-radius:14px;
    padding:14px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #8C6A20;}
</style>
</head>
<body>
<div id="app">

  <div id="homeview">
    <div class="hero">
      <svg viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
        <circle cx="75" cy="75" r="60" fill="#0F1830" stroke="#D9A94A" stroke-width="10"/>
        <circle cx="75" cy="20" r="4.5" fill="#D9A94A"/>
        <circle cx="75" cy="130" r="4.5" fill="#D9A94A"/>
        <circle cx="20" cy="75" r="4.5" fill="#D9A94A"/>
        <circle cx="130" cy="75" r="4.5" fill="#D9A94A"/>
        <circle cx="36" cy="36" r="4.5" fill="#D9A94A"/>
        <circle cx="114" cy="36" r="4.5" fill="#D9A94A"/>
        <circle cx="36" cy="114" r="4.5" fill="#D9A94A"/>
        <circle cx="114" cy="114" r="4.5" fill="#D9A94A"/>
        <circle cx="55" cy="45" r="1.6" fill="#E8E4D8"/>
        <circle cx="90" cy="38" r="1.2" fill="#E8E4D8"/>
        <circle cx="70" cy="58" r="1.4" fill="#E8E4D8"/>
        <path d="M28 82 Q52 68 75 82 Q98 96 122 82" stroke="#5B93B0" stroke-width="2.5" fill="none" opacity="0.8"/>
        <path d="M28 92 Q52 78 75 92 Q98 106 122 92" stroke="#3E6680" stroke-width="2.5" fill="none" opacity="0.6"/>
      </svg>
    </div>
    <div class="kicker"><div class="kicker-pill">⚗ CHEMISTRY LOGBOOK</div></div>
    <div class="top">
      <h1>Chem Lab Sketchbook</h1>
      <div class="sub" id="headerSubTag">Two worlds. One ship. Real reactions.</div>
      <div class="sub2" id="headerSub">Experiments across ocean liners and kitchens. What are you exploring today?</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-top-row">
        <div class="progress-label" id="progLabel">0 of 10 missions done</div>
        <div class="xp-pill" id="xpPill">⭐ 0 XP</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="badgerow" id="badgeRow"></div>
    <button class="cookbookbtn" onclick="openCookbook()">📖 My Cookbook — revise finished recipes</button>
    <div id="zonesArea"></div>
  </div>


  <div class="missionview" id="missionview">
    <button class="backbtn" onclick="goHome()">‹ Back to Chem Lab</button>
    <h2 class="mtitle" id="mTitle"></h2>
    <p class="mstory" id="mStory"></p>
    <div class="diagram-box" id="mDiagram"></div>
    <div class="dots" id="mDots"></div>
    <div id="stepArea"></div>
  </div>

  <div class="missionview" id="cookbookview">
    <button class="backbtn" onclick="goHome()">‹ Back to Chem Lab</button>
    <h2 class="mtitle">📖 My Cookbook</h2>
    <p class="mstory">Every finished recipe, all in one place — great for a quick revise before a test.</p>
    <div id="cookbookArea"></div>
  </div>

</div>

<script>
/* ============ DATA ============ */
const MISSIONS = [
  {
    id:'egg', zone:'kitchen', emoji:'🍳', title:'The Solid Egg',
    story:"You crack an egg into a hot pan. It starts runny and see-through. A few minutes later, it's solid and white.",
    diagram:`<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="300" height="120" fill="none"/>
      <ellipse cx="70" cy="80" rx="55" ry="18" fill="#4A4038"/>
      <ellipse cx="70" cy="74" rx="48" ry="15" fill="#F3E4B8"/>
      <ellipse cx="70" cy="74" rx="16" ry="11" fill="#E8A33D"/>
      <text x="70" y="106" text-anchor="middle" font-size="11" fill="#6B6459" font-family="-apple-system">Before: runny</text>
      <path d="M150 60 L190 60" stroke="#C9821F" stroke-width="3" marker-end="url(#arrow)"/>
      <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C9821F"/></marker></defs>
      <ellipse cx="235" cy="80" rx="55" ry="18" fill="#4A4038"/>
      <ellipse cx="235" cy="74" rx="48" ry="15" fill="#FAF3E3"/>
      <ellipse cx="235" cy="76" rx="15" ry="10" fill="#E8A33D"/>
      <text x="235" y="106" text-anchor="middle" font-size="11" fill="#6B6459" font-family="-apple-system">After: solid</text>
    </svg>`,
    notice:['Colour changed','Got firmer','Started see-through','Went from wet to dry-looking'],
    guessPresets:['It will go back to runny once it cools down','It will stay solid forever, even if it cools down'],
    watch:['Turned white and solid','Cannot be poured anymore','Stayed solid after cooling','Smells different'],
    sentenceTemplate:'The heat made the egg’s tiny building blocks (proteins) ___, and they cannot go back to how they were.',
    wordbank:['change shape permanently','just get warmer','freeze solid','disappear'],
    correctWord:'change shape permanently',
    labelA:{text:'Physical change (reversible)', key:'physical'},
    labelB:{text:'Chemical change (new substance, cannot undo)', key:'chemical'},
    correctLabel:'chemical',
    feedback:'This is a chemical change! Heat makes the egg proteins unfold and lock into a new solid shape. Unlike melting chocolate, cooling it back down will not turn it runny again — something new has formed.'
  },
  {
    id:'choc', zone:'kitchen', emoji:'🍫', title:'Melt & Reset',
    story:"You leave a chocolate bar in the sun. It turns into a puddle. You put it in the freezer... and it turns solid again.",
    diagram:`<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="55" width="60" height="35" rx="4" fill="#6B4226"/>
      <line x1="20" y1="72" x2="80" y2="72" stroke="#4A2C18" stroke-width="2"/>
      <line x1="35" y1="55" x2="35" y2="90" stroke="#4A2C18" stroke-width="2"/>
      <line x1="65" y1="55" x2="65" y2="90" stroke="#4A2C18" stroke-width="2"/>
      <text x="50" y="106" text-anchor="middle" font-size="11" fill="#6B6459">Solid bar</text>
      <path d="M150 60 L190 60" stroke="#C9821F" stroke-width="3" marker-end="url(#arrow2)"/>
      <defs><marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#C9821F"/></marker></defs>
      <path d="M215 85 Q225 65 240 82 Q250 65 260 85 Q262 92 240 92 Q218 92 215 85 Z" fill="#6B4226"/>
      <text x="238" y="106" text-anchor="middle" font-size="11" fill="#6B6459">Puddle</text>
      <path d="M150 30 a1 1 0 1 0 0.1 0" stroke="none"/>
      <text x="150" y="20" text-anchor="middle" font-size="10" fill="#C9821F">warm ☀️ / cold ❄️ reverses it</text>
    </svg>`,
    notice:['Went from solid to liquid','Changed shape','Got shiny/runny','Colour stayed the same'],
    guessPresets:['Once it melts, it can never be a solid bar again','If it cools back down, it can turn solid again'],
    watch:['Melted into a puddle','Froze back into a solid','Colour never changed','It’s still chocolate the whole time'],
    sentenceTemplate:'Melting and freezing chocolate only changes its ___, not what it’s made of.',
    wordbank:['state (solid/liquid)','ingredients','smell forever','taste forever'],
    correctWord:'state (solid/liquid)',
    labelA:{text:'Physical change (reversible)', key:'physical'},
    labelB:{text:'Chemical change (new substance, cannot undo)', key:'chemical'},
    correctLabel:'physical',
    feedback:'This is a physical change! Melting and freezing only change the chocolate’s state — it’s still the exact same chocolate before and after. Compare that to the egg: no amount of cooling turns a fried egg back into raw egg.'
  },
  {

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

  return { missions:{} };
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
function getM(id){
  if(!state.missions[id]) state.missions[id] = { step:0, notice:[], guess:null, guessOwn:'', watch:[], sketchBefore:null, sketchAfter:null, explainWord:null, label:null, labelFirstTry:null, labelFirstCorrect:null, done:false };

/* ============ MISSION VIEW ============ */
function openMission(id){
  currentMissionId = id;
  document.getElementById('homeview').style.display='none';
  document.getElementById('missionview').classList.add('active');
  const m = MISSIONS.find(x=>x.id===id);
  document.getElementById('mTitle').textContent = m.emoji+' '+m.title;
  document.getElementById('mStory').textContent = m.story;
  document.getElementById('mDiagram').innerHTML = m.diagram;
  renderStep();
}

function renderDots(){
  const ms = getM(currentMissionId);
  const wrap = document.getElementById('mDots');
  wrap.innerHTML='';
  for(let i=0;i<6;i++){
    const d = document.createElement('div');
    d.className='dot' + (i<ms.step?' pastdone':'') + (i===ms.step?' on':'');
    wrap.appendChild(d);
  }
}

function renderStep(){
  const m = MISSIONS.find(x=>x.id===currentMissionId);
  const ms = getM(currentMissionId);
  renderDots();
  const area = document.getElementById('stepArea');

  if(ms.step===6){ renderSummary(m, ms); return; }

  let html = '<div class="stepcard">';

  if(ms.step===0){
    html += `<div class="stepkicker">STEP 1 · NOTICE</div>
      <div class="stepq">What do you notice? Tap all that fit.</div>
      <div class="chipgrid">`;
    m.notice.forEach((c,i)=>{
      const sel = ms.notice.includes(i);
      html += `<div class="chip ${sel?'sel':''}" onclick="toggleChip('notice',${i})">${c}</div>`;
    });
    html += `</div>`;
  }
  else if(ms.step===1){
    html += `<div class="stepkicker">STEP 2 · GUESS</div>
      <div class="stepq">What do you think is really going on?</div>
      <div class="presetgrid">`;
    m.guessPresets.forEach((g,i)=>{
      const sel = ms.guess===i;
      html += `<div class="preset ${sel?'sel':''}" onclick="pickGuess(${i})">${g}</div>`;
    });
    html += `</div>
      <div class="ownwrap">
        <label>Or write your own guess:</label>
        <textarea rows="2" placeholder="I think..." oninput="ownGuess(this.value)">${ms.guessOwn||''}</textarea>
      </div>`;
  }
  else if(ms.step===2){
    html += `<div class="stepkicker">STEP 3 · WATCH</div>
      <div class="stepq">What actually happened? Tap all that fit.</div>
      <div class="chipgrid">`;
    m.watch.forEach((c,i)=>{
      const sel = ms.watch.includes(i);
      html += `<div class="chip ${sel?'sel':''}" onclick="toggleChip('watch',${i})">${c}</div>`;
    });
    html += `</div>`;
  }
  else if(ms.step===3){
    html += `<div class="stepkicker">STEP 4 · SKETCH IT (optional)</div>
      <div class="stepq">Draw what it looked like before, and what it looked like after.</div>
      <div class="sketchrow">
        <div class="sketchcol">
          <div class="sketchlabel">Before</div>
          <div class="canvaswrap"><canvas id="canvas-before" class="sketchcanvas"></canvas></div>
          <div class="sketchtools" id="tools-before"></div>
        </div>
        <div class="sketchcol">
          <div class="sketchlabel">After</div>
          <div class="canvaswrap"><canvas id="canvas-after" class="sketchcanvas"></canvas></div>
          <div class="sketchtools" id="tools-after"></div>
        </div>
      </div>`;
  }
  else if(ms.step===4){
    html += `<div class="stepkicker">STEP 5 · EXPLAIN</div>
      <div class="stepq">Tap the word that finishes the sentence.</div>
      <div class="sentence">${m.sentenceTemplate.replace('___','<span class="blank">'+(ms.explainWord!==null?m.wordbank[ms.explainWord]:'?????')+'</span>')}</div>
      <div class="wordbank">`;
    m.wordbank.forEach((w,i)=>{
      const sel = ms.explainWord===i;
      html += `<div class="word ${sel?'sel':''}" onclick="pickWord(${i})">${w}</div>`;
    });
    html += `</div>`;
  }
  else if(ms.step===5){
    html += `<div class="stepkicker">STEP 6 · LABEL IT</div>
      <div class="stepq">Which best describes what happened?</div>
      <div class="labelgrid">
        <div class="labelbtn pick-a ${labelClass(m,ms,m.labelA.key)}" onclick="pickLabel('${m.labelA.key}')">${m.labelA.text}</div>
        <div class="labelbtn pick-b ${labelClass(m,ms,m.labelB.key)}" onclick="pickLabel('${m.labelB.key}')">${m.labelB.text}</div>
      </div>`;
    if(ms.label){
      html += `<div class="feedback"><b>${ms.label===m.correctLabel?'Nice work!':'Good thinking — here’s what’s really going on:'}</b><br>${m.feedback}</div>`;
    }
  }

  const canNext = checkCanNext(m, ms);
  html += `<div class="navrow">
      ${ms.step>0 ? '<button class="backstep" onclick="prevStep()">Back</button>' : '<span></span>'}
      <button class="nextbtn" id="nextBtn" ${canNext?'':'disabled'} onclick="nextStep()">${ms.step===5?'Finish Recipe':'Next'}</button>
    </div>`;

  html += '</div>';
  area.innerHTML = html;

  if(ms.step===3){ initSketchStep(); }
}

function labelClass(m,ms,key){
  if(ms.label===key && key===m.correctLabel) return 'chosen-right';
  return '';
}

function checkCanNext(m, ms){
  if(ms.step===0) return ms.notice.length>0;
  if(ms.step===1) return ms.guess!==null || (ms.guessOwn && ms.guessOwn.trim().length>0);
  if(ms.step===2) return ms.watch.length>0;
  if(ms.step===3) return true; // sketch is optional, never blocks
  if(ms.step===4) return ms.explainWord!==null;
  if(ms.step===5) return ms.label!==null;
  return false;
}

function toggleChip(field, i){
  const ms = getM(currentMissionId);
  const arr = ms[field];
  const idx = arr.indexOf(i);
  if(idx>-1) arr.splice(idx,1); else arr.push(i);
  saveState(); renderStep();
}
function pickGuess(i){
  const ms = getM(currentMissionId);
  ms.guess = i; saveState(); renderStep();
}
function ownGuess(val){
  const ms = getM(currentMissionId);
  ms.guessOwn = val; ms.guess=null; saveState();
  const btn = document.getElementById('nextBtn');
  if(btn) btn.disabled = !checkCanNext(MISSIONS.find(x=>x.id===currentMissionId), ms);
}
function pickWord(i){
  const ms = getM(currentMissionId);
  ms.explainWord = i; saveState(); renderStep();
}
function pickLabel(key){
  const ms = getM(currentMissionId);
  const m = MISSIONS.find(x=>x.id===currentMissionId);
  if(ms.labelFirstTry===null){
    ms.labelFirstTry = key;
    ms.labelFirstCorrect = (key===m.correctLabel);
  }
  ms.label = key; saveState(); renderStep();
}
function nextStep(){
  const ms = getM(currentMissionId);
  ms.step = Math.min(ms.step+1, 6);
  if(ms.step===6) ms.done = true;
  saveState(); renderStep();
}
function prevStep(){
  const ms = getM(currentMissionId);
  ms.step = Math.max(ms.step-1, 0);
  saveState(); renderStep();
}

/* ============ SKETCH ENGINE ============ */
const SKETCH_COLORS = ['#2E2A24','#C4472B','#3E6680','#6B8F71','#E8A33D'];
const sketchRigs = {}; // key: 'before'/'after' -> {canvas, ctx, undoStack, color}

function initSketchStep(){
  ['before','after'].forEach(key=>{
    setupCanvasRig(key);
  });
}

function setupCanvasRig(key){
  const canvas = document.getElementById('canvas-'+key);
  const ms = getM(currentMissionId);
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cssW = rect.width || 280;
  const cssH = 170;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = 4;

  const rig = { canvas, ctx, cssW, cssH, undoStack: [], color: SKETCH_COLORS[0], drawing:false, lastX:0, lastY:0 };
  sketchRigs[key] = rig;

  // restore saved drawing, if any
  const saved = key==='before' ? ms.sketchBefore : ms.sketchAfter;
  if(saved){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img, 0, 0, cssW, cssH); };
    img.src = saved;
  }

  function getPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function pushUndoSnapshot(){
    try{
      rig.undoStack.push(canvas.toDataURL('image/png'));
      if(rig.undoStack.length>12) rig.undoStack.shift();
    }catch(e){}
  }

  function pointerDown(e){
    e.preventDefault();
    pushUndoSnapshot();
    rig.drawing = true;
    const p = getPos(e);
    rig.lastX = p.x; rig.lastY = p.y;
    ctx.beginPath();
    ctx.arc(p.x, p.y, ctx.lineWidth/2, 0, Math.PI*2);
    ctx.fillStyle = rig.color;
    ctx.fill();
  }
  function pointerMove(e){
    if(!rig.drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.strokeStyle = rig.color;
    ctx.beginPath();
    ctx.moveTo(rig.lastX, rig.lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    rig.lastX = p.x; rig.lastY = p.y;
  }
  function pointerUp(e){
    if(!rig.drawing) return;
    rig.drawing = false;
    persistCanvas(key);
  }

  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);

  renderSketchTools(key);
}

function renderSketchTools(key){
  const rig = sketchRigs[key];
  const wrap = document.getElementById('tools-'+key);
  let html = '';
  SKETCH_COLORS.forEach(c=>{
    html += `<div class="swatch ${rig.color===c?'on':''}" style="background:${c}" onclick="setSketchColor('${key}','${c}')"></div>`;
  });
  html += `<button class="toolbtn" onclick="undoSketch('${key}')">Undo</button>`;
  html += `<button class="toolbtn" onclick="clearSketch('${key}')">Clear</button>`;
  wrap.innerHTML = html;
}

function setSketchColor(key, color){
  sketchRigs[key].color = color;
  renderSketchTools(key);
}

function undoSketch(key){
  const rig = sketchRigs[key];
  if(rig.undoStack.length===0){ clearSketch(key); return; }
  const prev = rig.undoStack.pop();
  const img = new Image();
  img.onload = ()=>{
    rig.ctx.clearRect(0,0,rig.cssW,rig.cssH);
    rig.ctx.drawImage(img, 0, 0, rig.cssW, rig.cssH);
    persistCanvas(key);
  };
  img.src = prev;
}

function clearSketch(key){
  const rig = sketchRigs[key];
  rig.ctx.clearRect(0,0,rig.cssW,rig.cssH);
  rig.undoStack = [];
  persistCanvas(key);
}

function persistCanvas(key){
  const rig = sketchRigs[key];
  const ms = getM(currentMissionId);
  const dataUrl = rig.canvas.toDataURL('image/png');
  if(key==='before') ms.sketchBefore = dataUrl; else ms.sketchAfter = dataUrl;
  saveState();
}

/* ============ SUMMARY / COOKBOOK SHARED CARD ============ */
function sumCardHTML(m, ms){
  const noticeText = ms.notice.map(i=>m.notice[i]).join(', ') || '—';
  const guessText = ms.guessOwn && ms.guessOwn.trim().length>0 ? ms.guessOwn : (ms.guess!==null ? m.guessPresets[ms.guess] : '—');
  const watchText = ms.watch.map(i=>m.watch[i]).join(', ') || '—';
  const explainText = ms.explainWord!==null ? m.sentenceTemplate.replace('___', m.wordbank[ms.explainWord]) : '—';
  const labelText = ms.label===m.labelA.key ? m.labelA.text : m.labelB.text;
  return `
    <div class="sumcard">
      <div class="sumrow"><div class="k">I NOTICED</div><div class="v">${noticeText}</div></div>
      <div class="sumrow"><div class="k">MY GUESS</div><div class="v">${guessText}</div></div>
      <div class="sumrow"><div class="k">WHAT HAPPENED</div><div class="v">${watchText}</div></div>
      ${(ms.sketchBefore||ms.sketchAfter) ? `<div class="sumrow"><div class="k">MY SKETCHES</div><div class="sketchsumrow">
        ${ms.sketchBefore?`<img class="sketchthumb" src="${ms.sketchBefore}" alt="Before sketch">`:''}
        ${ms.sketchAfter?`<img class="sketchthumb" src="${ms.sketchAfter}" alt="After sketch">`:''}
      </div></div>` : ''}
      <div class="sumrow"><div class="k">MY EXPLANATION</div><div class="v">${explainText}</div></div>
      <div class="sumrow"><div class="k">TYPE OF CHANGE</div><div class="v">${labelText}</div></div>
    </div>`;
}

function renderSummary(m, ms){
  const area = document.getElementById('stepArea');
  area.innerHTML = `
    <div class="summary">
      <div class="donebadge">Mission complete ✓</div>
      <h2>${m.emoji} ${m.title} — Lab Card</h2>
      <div class="sub">Here's everything you figured out. It's saved in your Cookbook.</div>
      ${sumCardHTML(m, ms)}
      <button class="homebtn" onclick="goHome()">Back to Chem Lab</button>
    </div>
  `;
}

function openCookbook(){
  document.getElementById('homeview').style.display='none';
  document.getElementById('missionview').classList.remove('active');
  document.getElementById('cookbookview').classList.add('active');
  renderCookbook();
}

function renderCookbook(){
  const done = MISSIONS.filter(m=>getM(m.id).done);
  const area = document.getElementById('cookbookArea');
  if(done.length===0){
    area.innerHTML = `<div class="stepcard" style="text-align:center;">
      <p style="font-size:15px;color:var(--text-muted);margin:6px 0 0;">Finish a recipe and it'll show up here for revision — with your notes, guesses and sketches all together.</p>
    </div>`;
    return;
  }
  let html = `<button class="nextbtn" style="margin-bottom:18px;" onclick="exportAnkiCSV()">⬇️ Export ${done.length} recipe${done.length>1?'s':''} to Anki</button>`;
  done.forEach(m=>{
    const ms = getM(m.id);
    const zone = ZONES.find(z=>z.id===m.zone);
    html += `<div class="cookbookentry">
      <div class="zoneflag">${zone.emoji} ${zone.title}</div>
      <h3 class="mtitle" style="font-size:19px;">${m.emoji} ${m.title}</h3>
      ${sumCardHTML(m, ms)}
    </div>`;
  });
  area.innerHTML = html;
}

/* ============ ANKI CSV EXPORT ============ */
function csvField(text){
  return '"' + String(text).replace(/"/g,'""').replace(/\n/g,'<br>') + '"';
}

function exportAnkiCSV(){
  const rows = [];
  MISSIONS.filter(m=>getM(m.id).done).forEach(m=>{
    const ms = getM(m.id);
    const noticeText = ms.notice.map(i=>m.notice[i]).join(', ') || '—';

    // Card 1: concept check (physical/chemical, solution/suspension, etc.)
    const conceptFront = `Kitchen Chemistry — ${m.title}: ${m.labelA.text} or ${m.labelB.text}?`;
    const correctLabelText = m.correctLabel===m.labelA.key ? m.labelA.text : m.labelB.text;
    const conceptBack = `${correctLabelText}<br><br>${m.feedback}`;
    rows.push([conceptFront, conceptBack]);

    // Card 2: recall what happened
    const watchFront = `Kitchen Chemistry — ${m.title}: What did you notice happen?`;
    const watchBack = noticeText;
    rows.push([watchFront, watchBack]);

    // Card 3: explain the sentence
    const explainFront = `Kitchen Chemistry — ${m.title}: Finish the sentence — ${m.sentenceTemplate}`;
    const explainBack = m.sentenceTemplate.replace('___', '<b>'+m.correctWord+'</b>');
    rows.push([explainFront, explainBack]);
  });

  const csvLines = rows.map(r => r.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csvLines], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kitchen-chemistry-lab-flashcards.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
